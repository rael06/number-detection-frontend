# Builds every push and pull request; on master, deploys the build to Cloudflare Workers.
# The Cloudflare token lives in the GitHub environment `production` (Settings → Environments);
# « Run workflow » on master redeploys without a commit. See « Deployment » in the README.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Angular 8 builds with Node 12 (webpack 4); only the static output is published.
      - uses: actions/setup-node@v7
        with:
          node-version: 12
          cache: npm
      - run: npm ci
      # Same build as the former deployment (`ng build`): AOT rejects the private members used by templates.
      - run: npm run build

  deploy:
    needs: check
    # DEPLOY_ENABLED is a repository variable: the switch to stop deployments.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 12
          cache: npm
      - run: npm ci
      # Same build as the former deployment (`ng build`): AOT rejects the private members used by templates.
      - run: npm run build
      # Wrangler needs a current Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: deploy
